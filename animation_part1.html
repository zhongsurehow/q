<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕动画 - Part 1</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
        overflow: hidden;
    }
    .container {
        width: 800px;
        height: 450px; /* 16:9 aspect ratio */
        position: relative;
        background-color: #fff;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        border: 1px solid #ccc;
    }
    .subtitle {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
        color: #333;
        padding: 10px 20px;
        background-color: rgba(255, 255, 255, 0.8);
        border-radius: 5px;
        opacity: 0;
        text-align: center;
        white-space: nowrap;
    }
    #waterfall-svg {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 300px;
        height: 100%;
        z-index: 0;
        opacity: 0;
    }
    #funnel-svg {
        position: absolute;
        top: 150px; /* Position it to catch the waterfall */
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 150px;
        z-index: 1;
        opacity: 0;
    }
    .water-particle {
        position: absolute;
        background-color: #6495ED; /* Cornflower blue */
        border-radius: 50%;
    }
</style>
</head>
<body>

<div class="container">
    <div id="subtitle1" class="subtitle">你不是信息焦虑</div>
    <div id="subtitle2" class="subtitle">是你一直在拿漏斗接瀑布</div>

    <!-- SVG for Waterfall -->
    <svg id="waterfall-svg" viewBox="0 0 100 400">
        <defs>
            <linearGradient id="waterfallGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#6495ED;stop-opacity:0.8" />
                <stop offset="100%" style="stop-color:#ADD8E6;stop-opacity:0.5" />
            </linearGradient>
            <path id="waterPath" d="M 10 0 Q 10 100 10 200 L 10 400 L 90 400 L 90 200 Q 90 100 90 0 Z" />
        </defs>
        <use href="#waterPath" fill="url(#waterfallGradient)" id="mainFlow"/>
        <!-- Animated lines for flow effect -->
        <line id="flowLine1" x1="30" y1="-50" x2="30" y2="0" stroke="white" stroke-width="2" stroke-opacity="0.7"/>
        <line id="flowLine2" x1="50" y1="-100" x2="50" y2="-50" stroke="white" stroke-width="3" stroke-opacity="0.7"/>
        <line id="flowLine3" x1="70" y1="-20" x2="70" y2="30" stroke="white" stroke-width="2" stroke-opacity="0.7"/>
    </svg>

    <!-- SVG for Funnel -->
    <svg id="funnel-svg" viewBox="0 0 100 100">
        <path d="M 10 10 L 90 10 L 60 50 L 40 50 Z" fill="#A9A9A9"/> <!-- Funnel top -->
        <polygon points="40,50 60,50 55,80 45,80" fill="#A9A9A9"/> <!-- Funnel spout -->
        <!-- Overflowing water elements -->
        <circle id="overflow1" cx="20" cy="15" r="5" fill="#6495ED" opacity="0"/>
        <circle id="overflow2" cx="80" cy="15" r="7" fill="#6495ED" opacity="0"/>
        <path id="overflowPath" d="M 50 50 Q 30 60 20 70" stroke="#6495ED" stroke-width="4" fill="none" opacity="0"/>
    </svg>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script>
    const s1Duration = 2333 - 233; // 2100ms
    const s1Start = 233;

    const s2Start = 3133;
    const s2Duration = 6333 - 3133; // 3200ms

    const timeline = gsap.timeline();

    // Subtitle 1: 你不是信息焦虑
    timeline.to("#subtitle1", {
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
    }, s1Start / 1000);

    timeline.to("#subtitle1", {
        opacity: 0,
        duration: 0.5,
        ease: "power2.in"
    }, (s1Start + s1Duration) / 1000);

    // Waterfall and Funnel appear before subtitle 2 text
    const visualsAppearTime = (s2Start - 800) / 1000; // Visuals appear slightly before text

    timeline.to("#waterfall-svg", {
        opacity: 1,
        duration: 0.8,
        ease: "power1.out"
    }, visualsAppearTime);

    // Waterfall flow animation
    anime({
        targets: ['#flowLine1', '#flowLine2', '#flowLine3'],
        translateY: [
            {value: 450, duration: 1500, delay: anime.stagger(300)},
        ],
        opacity: [
            {value: 1, duration: 100, endDelay: 200},
            {value: 0, duration: 500}
        ],
        loop: true,
        easing: 'linear',
        delay: visualsAppearTime * 1000 // Sync with GSAP timeline
    });

    // Animate main flow to give a subtle pulse or shimmer
    anime({
        targets: '#mainFlow',
        opacity: [
            { value: 0.7, duration: 800, easing: 'easeInOutQuad' },
            { value: 1, duration: 800, easing: 'easeInOutQuad' }
        ],
        loop: true,
        direction: 'alternate',
        delay: visualsAppearTime * 1000
    });


    timeline.to("#funnel-svg", {
        opacity: 1,
        duration: 0.5,
        translateY: -20, // Funnel moves up a bit as if trying to catch
        ease: "back.out(1.7)"
    }, visualsAppearTime + 0.3);

    // Subtitle 2: 是你一直在拿漏斗接瀑布
    timeline.to("#subtitle2", {
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
    }, s2Start / 1000);

    // Funnel overflow animation - starts when subtitle 2 is visible
    const overflowStartTime = s2Start / 1000 + 0.5;
    timeline.to("#overflow1", { opacity: 0.8, scale: [0,1], translateX: -15, translateY: 10, duration: 0.7, ease: "elastic.out(1, 0.5)" }, overflowStartTime);
    timeline.to("#overflow2", { opacity: 0.8, scale: [0,1], translateX: 15, translateY: 10, duration: 0.7, ease: "elastic.out(1, 0.5)" }, overflowStartTime + 0.2);
    timeline.to("#overflowPath", { opacity: 0.8, strokeDashoffset: [anime.setDashoffset, 0], duration: 1, ease: "easeInOutSine" }, overflowStartTime + 0.4);

    // Funnel shakes a bit due to waterfall force
    timeline.to("#funnel-svg", {
        x: '+=3',
        y: '+=2',
        duration: 0.1,
        repeat: 5,
        yoyo: true,
        ease: "power1.inOut"
    }, overflowStartTime + 0.1);


    // Subtitle 2 and visuals fade out
    const s2EndTime = (s2Start + s2Duration) / 1000;
    timeline.to(["#subtitle2", "#waterfall-svg", "#funnel-svg", "#overflow1", "#overflow2", "#overflowPath"], {
        opacity: 0,
        duration: 0.8,
        ease: "power2.in"
    }, s2EndTime);

    // To test, you can play the timeline:
    // timeline.play();
</script>
</body>
</html>
