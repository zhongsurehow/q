<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕动画 - Part 3</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #1a252f; /* Dark background from previous part */
        overflow: hidden;
    }
    .container {
        width: 800px;
        height: 450px;
        position: relative;
        background-color: #2c3e50; /* Consistent with part 2's active background */
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        border: 1px solid #1a252f;
        overflow: hidden;
    }
    .subtitle {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 28px;
        color: #ecf0f1;
        padding: 10px 20px;
        background-color: rgba(0, 0, 0, 0.7);
        border-radius: 5px;
        opacity: 0;
        text-align: center;
        z-index: 100; /* Above other elements */
    }
    .effect-word { /* For "淹没", "灌满", "呛住" */
        position: absolute;
        font-size: 40px;
        font-weight: bold;
        color: #e74c3c; /* A warning/danger color */
        opacity: 0;
        z-index: 110;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    #container-catcher-svg {
        position: absolute;
        bottom: 50px; /* Positioned lower to catch water */
        left: 50%;
        transform: translateX(-50%);
        width: 150px;
        height: 120px;
        z-index: 10;
        opacity: 0;
    }
    #catcher-shape {
        fill: #bdc3c7; /* Light grey color for the container */
        stroke: #7f8c8d;
        stroke-width: 2;
    }
    #water-in-catcher {
        fill: #3498db;
        opacity: 0.7;
        transform-origin: bottom center;
    }
    .water-stream-svg-bg { /* Background water flow */
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        opacity: 0.5; /* Less prominent than catcher interaction */
    }
    .stream-line-bg {
        stroke-linecap: round;
        stroke-opacity: 0.4;
    }
    .splash-particle {
        position: absolute;
        background-color: #5dade2;
        border-radius: 50%;
        opacity: 0;
        z-index: 20;
    }
</style>
</head>
<body>

<div class="container">
    <div id="subtitle5" class="subtitle">你以为你能接住所有水</div>
    <div id="subtitle6" class="subtitle">结果只是被淹没、灌满、呛住</div>

    <div id="effect-word-yanmo" class="effect-word" style="top: 40%; left: 30%;">淹没</div>
    <div id="effect-word-guanman" class="effect-word" style="top: 50%; left: 50%; transform: translateX(-50%);">灌满</div>
    <div id="effect-word-qiangzhu" class="effect-word" style="top: 60%; left: 60%;">呛住</div>

    <!-- SVG for the container trying to catch water -->
    <svg id="container-catcher-svg" viewBox="0 0 150 120">
        <path id="catcher-shape" d="M10 110 C 10 60, 20 20, 75 20 C 130 20, 140 60, 140 110 Z"/>
        <rect id="water-in-catcher" x="11" y="110" width="128" height="0" rx="0" ry="0"/>
    </svg>

    <!-- Background water stream (similar to part 2 but more subdued) -->
    <svg class="water-stream-svg-bg">
        <!-- Lines will be generated by JS -->
    </svg>

    <!-- Splash particles container -->
    <div id="splash-container" style="position:absolute; width:100%; height:100%; top:0; left:0; z-index:20;"></div>


</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script>
    const s5Start = 12833;
    const s5Duration = 15066 - 12833; // 2233ms

    const s6Start = 15366;
    const s6Duration = 18933 - 15366; // 3567ms
    // s6 word timings (approximate within s6Duration)
    const yanmoDelay = 300; // ms after s6 starts
    const guanmanDelay = yanmoDelay + 1000;
    const qiangzhuDelay = guanmanDelay + 1000;


    const timeline = gsap.timeline();
    const svgNS = "http://www.w3.org/2000/svg";
    const streamSvgBg = document.querySelector('.water-stream-svg-bg');
    const containerWidth = 800;
    const containerHeight = 450;
    const streamColors = ["#3498db", "#5dade2", "#85c1e9"];

    // Generate background stream lines
    const numBgLines = 20;
    for (let i = 0; i < numBgLines; i++) {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute('x1', Math.random() * -containerWidth);
        line.setAttribute('y1', Math.random() * containerHeight);
        line.setAttribute('x2', Math.random() * -containerWidth + (Math.random() * 80 + 40));
        line.setAttribute('y2', line.getAttribute('y1'));
        line.setAttribute('stroke', streamColors[Math.floor(Math.random() * streamColors.length)]);
        line.setAttribute('stroke-width', Math.random() * 2 + 1);
        line.classList.add('stream-line-bg');
        streamSvgBg.appendChild(line);
    }
    const bgStreamLines = document.querySelectorAll('.stream-line-bg');
    const bgStreamAnimation = anime({
        targets: bgStreamLines,
        translateX: `+=${containerWidth * 2 + 150}`,
        duration: () => anime.random(1500, 2500), // Slower than main stream in part 2
        delay: anime.stagger(80),
        loop: true,
        easing: 'linear',
        update: function(anim) {
            anim.animations.forEach(a => {
                const currentX = parseFloat(a.animatable.target.getAttribute('x1'));
                if (currentX > containerWidth + 40) {
                    a.animatable.target.setAttribute('x1', Math.random() * -150 - 40);
                    const newY = Math.random() * containerHeight;
                    a.animatable.target.setAttribute('y1', newY);
                    a.animatable.target.setAttribute('y2', newY);
                }
            });
        }
    });
    // End background stream

    const catcherSVG = document.getElementById('container-catcher-svg');
    const waterInCatcher = document.getElementById('water-in-catcher');
    const catcherShape = document.getElementById('catcher-shape');

    // Subtitle 5: 你以为你能接住所有水
    timeline.to(catcherSVG, {
        opacity: 1,
        duration: 0.5,
        ease: "power1.out"
    }, s5Start / 1000);
    timeline.to("#subtitle5", {
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
    }, s5Start / 1000);

    // Catcher tries to catch - small shaky movements
    timeline.to(catcherSVG, {
        x: "+=5",
        repeat: 5,
        yoyo: true,
        duration: 0.1,
        ease: "power1.inOut"
    }, (s5Start + 500) / 1000);

    timeline.to("#subtitle5", {
        opacity: 0,
        duration: 0.5,
        ease: "power2.in"
    }, (s5Start + s5Duration) / 1000);

    // Subtitle 6: 结果只是被淹没、灌满、呛住
    const s6Time = s6Start / 1000;
    timeline.to("#subtitle6", {
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
    }, s6Time);

    // "淹没" - Water level rises around catcher (simulated by bg stream becoming more intense/opaque)
    // and catcher itself starts to fill
    const yanmoTime = (s6Start + yanmoDelay) / 1000;
    timeline.to("#effect-word-yanmo", { opacity: 1, scale: 1.2, duration: 0.3, ease: "back.out(1.7)" }, yanmoTime);
    timeline.to(streamSvgBg, { opacity: 0.8, duration: 0.5 }, yanmoTime); // BG water becomes more prominent
    timeline.to(waterInCatcher, {
        attr: { height: 60, y: 50 }, // Fill halfway
        duration: 1,
        ease: "power1.out"
    }, yanmoTime);
    timeline.to("#effect-word-yanmo", { opacity: 0, scale: 0.8, duration: 0.3, delay: 0.7 }, yanmoTime);


    // "灌满" - Catcher fills completely and overflows (splashes)
    const guanmanTime = (s6Start + guanmanDelay) / 1000;
    timeline.to("#effect-word-guanman", { opacity: 1, scale: 1.2, duration: 0.3, ease: "back.out(1.7)" }, guanmanTime);
    timeline.to(waterInCatcher, {
        attr: { height: 100, y: 10 }, // Fill completely
        duration: 1,
        ease: "bounce.out" // Bouncy fill
    }, guanmanTime);

    // Splash effect for "灌满"
    timeline.call(() => createSplashes(catcherSVG.getBoundingClientRect(), 20, '#3498db'), null, guanmanTime + 0.5);
    timeline.to(catcherSVG, { // Catcher shakes more violently
        x: '+=10',
        y: '-=5',
        rotation: '+=5',
        repeat: 7,
        yoyo: true,
        duration: 0.08,
        ease: "power2.inOut"
    }, guanmanTime + 0.2);
    timeline.to("#effect-word-guanman", { opacity: 0, scale: 0.8, duration: 0.3, delay: 0.7 }, guanmanTime);


    // "呛住" - More violent splashes, catcher might tilt or look submerged
    const qiangzhuTime = (s6Start + qiangzhuDelay) / 1000;
    timeline.to("#effect-word-qiangzhu", { opacity: 1, scale: 1.2, duration: 0.3, ease: "back.out(1.7)" }, qiangzhuTime);
    timeline.call(() => createSplashes(catcherSVG.getBoundingClientRect(), 30, '#5dade2', 15, 25), null, qiangzhuTime + 0.2); // More splashes
    timeline.to(catcherSVG, {
        rotation: -15,
        y: "+=20", // Sinks a bit
        duration: 0.7,
        ease: "power1.inOut"
    }, qiangzhuTime);
    timeline.to(streamSvgBg, { opacity: 1, duration: 0.5 }, qiangzhuTime); // BG water at full opacity, submerging effect
    timeline.to("#effect-word-qiangzhu", { opacity: 0, scale: 0.8, duration: 0.3, delay: 0.7 }, qiangzhuTime);


    // Fade out everything at the end of s6
    const s6EndTime = (s6Start + s6Duration) / 1000;
    timeline.to(["#subtitle6", catcherSVG, streamSvgBg, "#water-in-catcher"], {
        opacity: 0,
        duration: 0.8,
        ease: "power2.in"
    }, s6EndTime);
    timeline.call(() => { // Clear any remaining splashes
        document.getElementById('splash-container').innerHTML = '';
    }, null, s6EndTime + 0.8);


    function createSplashes(sourceRect, count = 10, color = '#3498db', minSize = 5, maxSize = 15) {
        const splashContainer = document.getElementById('splash-container');
        const containerRect = document.querySelector('.container').getBoundingClientRect();

        for (let i = 0; i < count; i++) {
            const particle = document.createElement('div');
            particle.classList.add('splash-particle');
            particle.style.backgroundColor = color;
            const size = anime.random(minSize, maxSize);
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';

            // Position relative to the source (catcher) but within the main animation container
            const startX = sourceRect.left - containerRect.left + sourceRect.width / 2;
            const startY = sourceRect.top - containerRect.top + sourceRect.height / 3; // Splashes from top part

            particle.style.left = startX + 'px';
            particle.style.top = startY + 'px';
            splashContainer.appendChild(particle);

            anime({
                targets: particle,
                translateX: [0, anime.random(-80, 80)],
                translateY: [0, anime.random(-60, 20)], // Mostly upward and outward
                scale: [1, 0],
                opacity: [1, 0],
                duration: anime.random(500, 1000),
                easing: 'easeOutExpo',
                complete: () => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }
            });
        }
    }
    // timeline.play(); // For testing
</script>
</body>
</html>
