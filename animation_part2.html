<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕动画 - Part 2</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #e0e0e0; /* Slightly different background */
        overflow: hidden;
    }
    .container {
        width: 800px;
        height: 450px;
        position: relative;
        background-color: #2c3e50; /* Darker background for contrast with water */
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        border: 1px solid #1a252f;
        overflow: hidden; /* Important for containing the flow */
    }
    .subtitle {
        position: absolute;
        bottom: 30px; /* Adjusted position */
        left: 50%;
        transform: translateX(-50%);
        font-size: 30px; /* Slightly larger */
        color: #ecf0f1; /* Light text color */
        padding: 12px 22px;
        background-color: rgba(0, 0, 0, 0.6);
        border-radius: 6px;
        opacity: 0;
        text-align: center;
        white-space: nowrap;
        z-index: 10;
    }
    .water-stream-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }
    .stream-line {
        stroke-linecap: round;
        stroke-opacity: 0.6;
    }
</style>
</head>
<body>

<div class="container">
    <div id="subtitle3" class="subtitle">现在的信息世界，像水一样</div>
    <div id="subtitle4" class="subtitle">流得快、流得急</div>

    <svg class="water-stream-svg">
        <!-- We will generate lines for the stream with JavaScript -->
    </svg>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script>
    const s3Start = 6900;
    const s3Duration = 9966 - 6900; // 3066ms

    const s4Start = 9966;
    const s4Duration = 12066 - 9966; // 2100ms

    const timeline = gsap.timeline();
    const svgNS = "http://www.w3.org/2000/svg";
    const streamSvg = document.querySelector('.water-stream-svg');
    const containerWidth = 800;
    const containerHeight = 450;

    const streamColors = ["#3498db", "#5dade2", "#85c1e9", "#aed6f1"];

    // Generate stream lines
    const numLines = 30;
    for (let i = 0; i < numLines; i++) {
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute('x1', Math.random() * -containerWidth); // Start off-screen left
        line.setAttribute('y1', Math.random() * containerHeight);
        line.setAttribute('x2', Math.random() * -containerWidth + (Math.random() * 100 + 50)); // Varying length
        line.setAttribute('y2', line.getAttribute('y1')); // Horizontal lines
        line.setAttribute('stroke', streamColors[Math.floor(Math.random() * streamColors.length)]);
        line.setAttribute('stroke-width', Math.random() * 3 + 2); // Varying thickness
        line.classList.add('stream-line');
        streamSvg.appendChild(line);
    }

    const streamLines = document.querySelectorAll('.stream-line');

    // Animate stream lines
    const streamAnimation = anime({
        targets: streamLines,
        translateX: `+=${containerWidth * 2 + 200}`, // Move across and off-screen right
        duration: () => anime.random(1000, 2000), // Each line has a slightly different speed
        delay: anime.stagger(50, {start: (s3Start - 500)/1000}), // Staggered start
        loop: true,
        easing: 'linear',
        update: function(anim) {
            // Reset lines that have gone off-screen
            anim.animations.forEach(a => {
                const currentX = parseFloat(a.animatable.target.getAttribute('x1'));
                if (currentX > containerWidth + 50) { // Check if it's off screen right
                    a.animatable.target.setAttribute('x1', Math.random() * -200 - 50);
                    const newY = Math.random() * containerHeight;
                    a.animatable.target.setAttribute('y1', newY);
                    a.animatable.target.setAttribute('y2', newY); // Keep it horizontal
                     // Reset translateX in GSAP if it's also controlling it, or manage through Anime.js only
                }
            });
        }
    });
    streamAnimation.pause(); // Start paused, will be controlled by GSAP

    // Subtitle 3: 现在的信息世界，像水一样
    timeline.add(() => streamAnimation.play(), s3Start / 1000); // Start stream animation
    timeline.to("#subtitle3", {
        opacity: 1,
        duration: 0.5,
        ease: "power2.out"
    }, s3Start / 1000);

    timeline.to("#subtitle3", {
        opacity: 0,
        duration: 0.5,
        ease: "power2.in"
    }, (s3Start + s3Duration) / 1000);

    // Subtitle 4: 流得快、流得急
    const s4Time = s4Start / 1000;
    timeline.call(() => {
        // Increase speed of existing lines for "流得快、流得急"
        streamAnimation.pause();
        anime({
            targets: streamLines,
            translateX: `+=${containerWidth * 2 + 200}`,
            duration: () => anime.random(400, 800), // Faster duration
            loop: true,
            easing: 'linear',
             update: function(anim) { // Reset logic needs to be here too
                anim.animations.forEach(a => {
                    const currentX = parseFloat(a.animatable.target.getAttribute('x1'));
                     if (currentX > containerWidth + 50) {
                        a.animatable.target.setAttribute('x1', Math.random() * -200 - 50);
                        const newY = Math.random() * containerHeight;
                        a.animatable.target.setAttribute('y1', newY);
                        a.animatable.target.setAttribute('y2', newY);
                    }
                });
            }
        });
    }, null, s4Time);

    timeline.fromTo("#subtitle4",
        { opacity: 0, scaleX: 0.8, filter: "blur(3px)" },
        {
            opacity: 1,
            scaleX: 1,
            filter: "blur(0px)",
            duration: 0.4, // Quick appearance
            ease: "power3.out"
        }, s4Time);

    // Fade out subtitle 4 and slow down stream at the end
    const s4EndTime = (s4Start + s4Duration) / 1000;
    timeline.to("#subtitle4", {
        opacity: 0,
        duration: 0.5,
        ease: "power2.in"
    }, s4EndTime);

    timeline.call(() => {
        // Slow down or stop stream animation
        anime({
            targets: streamLines,
            opacity: 0,
            duration: 1000, // Fade out lines
            easing: 'easeOutExpo',
            complete: () => {
                streamAnimation.pause(); // Fully stop after fade
                // Optionally remove lines or hide SVG
                // streamSvg.innerHTML = '';
            }
        });
    }, null, s4EndTime + 0.2);

    // timeline.play(); // For testing
</script>
</body>
</html>
