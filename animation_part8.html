<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕动画 - Part 8 (Valve 2 Action)</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f4f7f6; /* Calm, slightly off-white */
        overflow: hidden;
    }
    .container {
        width: 800px;
        height: 450px;
        position: relative;
        background-color: #eaf2f8; /* Light, clear blue from a previous calm scene */
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
        border: 1px solid #d1d9e0;
        overflow: hidden;
    }
    .subtitle {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 26px;
        color: #1f618d; /* Calmer blue text */
        padding: 10px 20px;
        background-color: rgba(234, 242, 248, 0.9);
        border-radius: 5px;
        opacity: 0;
        text-align: center;
        z-index: 100;
    }

    #keyword-anchor-display { /* From previous part, now less prominent initially */
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 36px;
        font-weight: bold;
        color: #d35400; /* Orange, same as Part 7's anchor text */
        opacity: 0.8;
        padding: 8px 15px;
        border: 2px dashed #d35400; /* Orange dashed border, same as Part 7's anchor */
        border-radius: 8px;
        z-index: 15;
    }
    .info-blob-p8 { /* Re-styling for this part */
        position: absolute;
        border-radius: 8px;
        padding: 6px 12px;
        font-size: 15px;
        color: white;
        box-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        white-space: nowrap;
        transition: transform 0.3s ease, opacity 0.3s ease; /* For smooth swipe */
    }
    .relevant-blob-p8 { background-color: #27ae60; opacity: 0.9; z-index:10; } /* Slightly less opaque */
    .irrelevant-blob-p8 { background-color: #7f8c8d; opacity: 0.5; z-index:5; } /* More faded */

    #small-q-mark { /* For "不相关?" above blob */
        position: absolute;
        font-size: 20px;
        font-weight: bold;
        color: #e67e22;
        opacity: 0;
        z-index: 20;
        pointer-events: none;
    }

    #swipe-hand-svg { /* Hand for swiping */
        position: absolute;
        width: 70px;
        height: 70px;
        opacity: 0;
        z-index: 50;
        pointer-events: none;
        transform: scaleX(-1); /* Flip hand to swipe left-to-right */
    }
     #swipe-hand-svg path { fill: #2980b9; } /* Blue hand */

    #gossip-icons-container {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 5;
    }
    .gossip-icon-svg {
        position: absolute;
        width: 50px;
        height: 50px;
        opacity: 0;
        filter: drop-shadow(1px 1px 2px rgba(0,0,0,0.3));
    }
    /* Shield effect for keyword anchor */
    #keyword-shield {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120px; /* Slightly larger than anchor */
        height: 120px;
        border-radius: 50%;
        background-color: rgba(231, 76, 60, 0.2); /* Semi-transparent red shield */
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
        z-index: 14; /* Below anchor text, above blobs */
    }

</style>
</head>
<body>

<div class="container" id="mainContainerP8">
    <div id="subtitle21" class="subtitle">不相关？</div>
    <div id="subtitle22" class="subtitle">就滑走，不内耗</div>
    <div id="subtitle23" class="subtitle">比如今天的关键词是“专注”，</div>
    <div id="subtitle24" class="subtitle">那你就别看跟八卦有关的一切</div>

    <div id="keyword-anchor-display">专注</div>
    <div id="blobs-area-p8">
        <!-- Blobs from previous part's concept will be added by JS -->
    </div>
    <div id="small-q-mark">?</div>

    <svg id="swipe-hand-svg" viewBox="0 0 24 24">
        <path d="M4,10V13H10L10.5,12.5L12.26,10.73C12.5,10.5 12.74,10.26 12.96,10.04L14.96,8.04C15.39,7.61 16,7.43 16.63,7.5C17.26,7.57 17.81,7.89 18.13,8.38L21.13,12.38C21.32,12.63 21.41,12.93 21.38,13.22C21.35,13.51 21.21,13.78 21,14C20.79,14.21 20.5,14.33 20.19,14.33H10V19A1,1 0 0,1 9,20H5A1,1 0 0,1 4,19V10Z"/>
    </svg>

    <div id="gossip-icons-container">
        <!-- Gossip icons will be added by JS -->
    </div>
    <div id="keyword-shield"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
<script>
    const s21Start = 61633;
    const s21Duration = 62533 - 61633; // 900ms

    const s22Start = 62533;
    const s22Duration = 64466 - 62533; // 1933ms

    const s23Start = 64633;
    const s23Duration = 67600 - 64633; // 2967ms

    const s24Start = 67900;
    const s24Duration = 70866 - 67900; // 2966ms

    const timeline = gsap.timeline();
    const container = document.getElementById('mainContainerP8');
    const keywordAnchor = document.getElementById('keyword-anchor-display');
    const blobsArea = document.getElementById('blobs-area-p8');
    const smallQMark = document.getElementById('small-q-mark');
    const swipeHand = document.getElementById('swipe-hand-svg');
    const gossipContainer = document.getElementById('gossip-icons-container');
    const keywordShield = document.getElementById('keyword-shield');
    const exampleKeywordText = "专注"; // Consistent keyword

    let irrelevantBlobToSwipe = null;

    // --- Initial scene setup with keyword anchor and example blobs ---
    // Initial setup: Recreate a simplified state from end of Part 7
    function setupInitialScene() {
        blobsArea.innerHTML = ''; // Clear previous
        keywordAnchor.textContent = exampleKeywordText;
        gsap.set(keywordAnchor, { opacity: 0.8, scale: 1 }); // Ensure it's visible

        const initialBlobs = [
            { text: exampleKeywordText, relevant: true, x: 350, y: 180 },
            { text: "学习", relevant: true, x: 400, y: 220 },
            { text: "八卦", relevant: false, x: 100, y: 150 }, // This one will be targeted
            { text: "娱乐", relevant: false, x: 600, y: 120, opacity: 0.4 },
            { text: "工作", relevant: true, x: 450, y: 160, opacity: 0.9 },
        ];

        initialBlobs.forEach((b, index) => {
            const blob = document.createElement('div');
            blob.classList.add('info-blob-p8');
            blob.textContent = b.text;
            if (b.relevant) {
                blob.classList.add('relevant-blob-p8');
                gsap.set(blob, { opacity: b.opacity !== undefined ? b.opacity : 0.9 });
            } else {
                blob.classList.add('irrelevant-blob-p8');
                gsap.set(blob, { opacity: b.opacity !== undefined ? b.opacity : 0.5 });
                if (b.text === "八卦" && !irrelevantBlobToSwipe) { // Target the first "八卦" blob
                    irrelevantBlobToSwipe = blob;
                }
            }
            blob.style.left = b.x + 'px';
            blob.style.top = b.y + 'px';
            blobsArea.appendChild(blob);
        });
        if (!irrelevantBlobToSwipe && blobsArea.querySelector('.irrelevant-blob-p8')) {
             irrelevantBlobToSwipe = blobsArea.querySelector('.irrelevant-blob-p8'); // Fallback
        }
    }
    // Setup slightly before s21 starts
    timeline.call(setupInitialScene, null, (s21Start - 200) / 1000);

    // --- "Irrelevant?" - Highlight and question an irrelevant blob ---
    // Subtitle 21: 不相关？
    const s21Time = s21Start / 1000;
    timeline.to("#subtitle21", { opacity: 1, duration: 0.3, ease: "power2.out" }, s21Time);
    timeline.call(() => {
        if (irrelevantBlobToSwipe) {
            const rect = irrelevantBlobToSwipe.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            gsap.set(smallQMark, {
                left: rect.left - containerRect.left + rect.width / 2 - smallQMark.offsetWidth / 2,
                top: rect.top - containerRect.top - smallQMark.offsetHeight - 5
            });
            gsap.to(smallQMark, { opacity: 1, scale: [0.5, 1], duration: 0.3, ease: "elastic.out(1,0.7)" });
            gsap.to(irrelevantBlobToSwipe, { opacity: 0.8, scale: 1.1, duration: 0.2 }); // Highlight blob
        }
    }, null, s21Time + 0.1);
    timeline.to("#subtitle21", { opacity: 0, duration: 0.2, ease: "power2.in" }, (s21Start + s21Duration - 200) / 1000);
    timeline.to(smallQMark, { opacity: 0, duration: 0.2 }, (s21Start + s21Duration - 200) / 1000);


    // --- Swipe away the irrelevant blob ---
    // Subtitle 22: 就滑走，不内耗
    const s22Time = s22Start / 1000;
    timeline.to("#subtitle22", { opacity: 1, duration: 0.4, ease: "power2.out" }, s22Time);
    timeline.call(() => {
        if (irrelevantBlobToSwipe) {
            const blobRect = irrelevantBlobToSwipe.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            gsap.to(swipeHand, {
                opacity: 1,
                left: blobRect.left - containerRect.left - swipeHand.offsetWidth + 20,
                top: blobRect.top - containerRect.top + blobRect.height / 2 - swipeHand.offsetHeight / 2,
                duration: 0.2
            });
            gsap.to(swipeHand, { // Swipe motion
                x: blobRect.width + 100, // Swipe past the blob
                opacity: 0,
                duration: 0.5,
                delay: 0.2,
                ease: "power1.in"
            });
            gsap.to(irrelevantBlobToSwipe, { // Blob gets swiped
                x: "+=150", // Move it off screen
                opacity: 0,
                scale: 0.7,
                duration: 0.5,
                delay: 0.25, // Slightly after hand starts moving
                ease: "power1.in",
                onComplete: () => { if(irrelevantBlobToSwipe.parentNode) irrelevantBlobToSwipe.parentNode.removeChild(irrelevantBlobToSwipe); }
            });
             // Make background slightly clearer for "不内耗"
            gsap.to(container, { backgroundColor: "#f0f5f9", duration: 0.5, delay: 0.3 });
        }
    }, null, s22Time + 0.2);
    timeline.to("#subtitle22", { opacity: 0, duration: 0.3, ease: "power2.in" }, (s22Start + s22Duration - 300) / 1000);


    // Subtitle 23: 比如今天的关键词是“专注”，
    const s23Time = s23Start / 1000;
    timeline.set("#subtitle23", { textContent: "比如今天的关键词是：", immediateRender: true }, s23Time);
    timeline.to("#subtitle23", { opacity: 1, duration: 0.4, ease: "power2.out" }, s23Time);
    // --- Re-emphasize the current keyword "专注" ---
    timeline.to(keywordAnchor, { // Emphasize keyword
        scale: 1.15,
        borderColor: "#e67e22", // Brighter orange
        color: "#e67e22",
        duration: 0.4,
        yoyo: true,
        repeat: 1,
        ease: "power1.inOut"
    }, s23Time + 0.2);
    timeline.to("#subtitle23", { opacity: 0, duration: 0.3, ease: "power2.in" }, (s23Start + s23Duration - 300) / 1000);


    // --- Shield activates and repels incoming gossip icons ---
    // Subtitle 24: 那你就别看跟八卦有关的一切
    const s24Time = s24Start / 1000;
    timeline.to("#subtitle24", { opacity: 1, duration: 0.4, ease: "power2.out" }, s24Time);
    timeline.to(keywordShield, { opacity: 1, scale: 1, duration: 0.3, ease: "elastic.out(1,0.6)"}, s24Time + 0.2);
    timeline.call(spawnGossipIcons, [3], s24Time + 0.4); // Spawn 3 gossip icons

    // Fade out all at the end
    const s24EndTime = (s24Start + s24Duration) / 1000;
    timeline.to(["#subtitle24", keywordAnchor, keywordShield], {
        opacity: 0,
        duration: 0.5,
        ease: "power2.in"
    }, s24EndTime - 0.5);
    timeline.to(blobsArea, { opacity: 0, duration: 0.5, onComplete: () => blobsArea.innerHTML = '' }, s24EndTime - 0.5);
    timeline.to(gossipContainer, { opacity: 0, duration: 0.5, onComplete: () => gossipContainer.innerHTML = '' }, s24EndTime - 0.5);
    timeline.call(() => container.style.backgroundColor = "#eaf2f8", null, s24EndTime); // Reset bg

    const gossipIconPaths = [
        "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-5h2v2h-2v-2zm0-8h2v6h-2V7z", // Exclamation
        "M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" // Speech bubble
    ];

    function spawnGossipIcons(count) {
        gossipContainer.innerHTML = '';
        const anchorRect = keywordAnchor.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();

        for (let i = 0; i < count; i++) {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.classList.add('gossip-icon-svg');
            svg.setAttribute('viewBox', '0 0 24 24');
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute('d', gossipIconPaths[i % gossipIconPaths.length]);
            path.setAttribute('fill', `#${Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')}`); // Random color
            svg.appendChild(path);

            // Position them to come from outside towards anchor
            const angle = Math.random() * Math.PI * 2;
            const startX = containerRect.width / 2 + Math.cos(angle) * (containerRect.width / 2 + 50);
            const startY = containerRect.height / 2 + Math.sin(angle) * (containerRect.height / 2 + 50);
            svg.style.left = startX + 'px';
            svg.style.top = startY + 'px';
            gossipContainer.appendChild(svg);

            anime({
                targets: svg,
                left: [startX, anchorRect.left - containerRect.left + anchorRect.width/2 - 25 + anime.random(-30,30)],
                top: [startY, anchorRect.top - containerRect.top + anchorRect.height/2 - 25 + anime.random(-30,30)],
                opacity: [0, 1],
                scale: [0.3, 1],
                duration: 800,
                easing: 'easeOutQuad',
                complete: (anim) => { // When it reaches near anchor, repel it by the shield
                    anime({
                        targets: anim.animatables[0].target,
                        left: startX + anime.random(-50,50), // Back towards where it came from (or scatter more widely)
                        top: startY + anime.random(-50,50),
                        opacity: 0,
                        scale: 0.3,
                        duration: 600,
                        easing: 'easeInQuad',
                        delay: anime.random(0,200), // Stagger the repulsion
                        complete: () => { if(svg.parentNode) svg.parentNode.removeChild(svg); } // Clean up
                    });
                }
            });
        }
    }
    // timeline.play(); // For testing
</script>
</body>
</html>
